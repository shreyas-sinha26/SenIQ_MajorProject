# Render Blueprint — SenIQ (Phase 4: cloud deploy)
# Deploy: push to main, then in Render → New → Blueprint → pick this repo.
# Postgres is Neon (external), so DATABASE_URL is set manually (sync:false) —
# we do NOT provision a Render database here.
#
# Migrations run automatically on boot (server/db.js runMigrations, called from
# server/index.js), so the normal start command also migrates on every deploy.

services:
  - type: web
    name: seniq
    runtime: node
    plan: starter            # always-on (~$7/mo). Do NOT use 'free' — it sleeps
                             # after 15 min idle, which would halt the in-process cron.
    region: singapore        # closest Render region to India; change if you prefer
    branch: main             # auto-deploy on push to main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Strong secret auto-generated by Render (rotates the dev default).
      - key: JWT_SECRET
        generateValue: true
      # Public base URL — set to your domain once DNS is live (used for HTTPS canonical
      # + later OAuth/Stripe callbacks). Until the domain is attached, use the
      # onrender.com URL Render assigns.
      - key: APP_URL
        sync: false
      # ── Managed Postgres (Neon) — paste the POOLED connection string here ──
      # Must include ?sslmode=require (Neon enforces TLS).
      - key: DATABASE_URL
        sync: false
      # ── Phase 1: prices ──
      - key: FINNHUB_API_KEY
        sync: false
      # ── Phase 2: Reddit ingest ──
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      # ── Phase 3: smart money ──
      - key: SEC_USER_AGENT
        value: SenIQ affiliates@arnifi.com
      - key: CONGRESS_TRADES_URL
        sync: false
      # ── Ops: error monitoring (optional, free Sentry tier) ──
      # Leave unset to disable Sentry entirely (the app no-ops without it).
      - key: SENTRY_DSN
        sync: false
      # FinBERT now runs via the HF Inference API (no model loaded in-process).
      # Set FINBERT_CLASSIFY=1 and add your HF_API_TOKEN below to enable it.
      - key: FINBERT_CLASSIFY
        value: "1"
      # Free-tier HF Inference API token — huggingface.co → Settings → Access Tokens.
      - key: HF_API_TOKEN
        sync: false
