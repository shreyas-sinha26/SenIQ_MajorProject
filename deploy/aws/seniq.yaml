AWSTemplateFormatVersion: "2010-09-09"
Description: SenIQ v1 - one server for the app, its scheduled jobs and its database, plus an encrypted bucket for backups and releases.

Parameters:
  InstanceType:
    Type: String
    Default: t4g.medium
    Description: 2 vCPU, 4 GB (ARM). Enough for the app, FinBERT and Postgres together.
  VolumeSize:
    Type: Number
    Default: 30
    Description: Disk in GB (the system, Docker images, the database).
  LatestAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64

Resources:
  # Backups, release bundles and the one-time database copy. Private, encrypted, never public.
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-backups
            Status: Enabled
            Prefix: backups/
            ExpirationInDays: 30
          - Id: expire-old-releases
            Status: Enabled
            Prefix: releases/
            ExpirationInDays: 30

  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Commands reach the server through AWS Systems Manager, so no SSH port is open.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: seniq-server
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub "${Bucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:PutParameter]
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/seniq/*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref Role]

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SenIQ - web traffic only (no SSH; administration is through Systems Manager)
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP (redirects to HTTPS) }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS }

  Server:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmi
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt SecurityGroup.GroupId]
      MetadataOptions:
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: !Ref VolumeSize, VolumeType: gp3, Encrypted: true, DeleteOnTermination: false }
      Tags:
        - { Key: Name, Value: seniq }
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker cronie
          systemctl enable --now docker crond
          # Docker Compose and Buildx plugins (Compose needs Buildx to build images)
          mkdir -p /usr/libexec/docker/cli-plugins
          curl -fsSL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m)" \
            -o /usr/libexec/docker/cli-plugins/docker-compose
          ARCH=$(uname -m | sed 's/aarch64/arm64/; s/x86_64/amd64/')
          BUILDX_URL=$(curl -fsSL https://api.github.com/repos/docker/buildx/releases/latest \
            | grep -o "https://[^\"]*linux-$ARCH\"" | tr -d '"' | head -1)
          curl -fsSL "$BUILDX_URL" -o /usr/libexec/docker/cli-plugins/docker-buildx
          chmod +x /usr/libexec/docker/cli-plugins/docker-compose /usr/libexec/docker/cli-plugins/docker-buildx
          # Swap: a margin for the image build and for a busy moment, so the app is slowed, not killed
          fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
          echo "/swapfile none swap sw 0 0" >> /etc/fstab
          # Automatic security updates (not allowed to stop the setup if it fails)
          (dnf install -y dnf-automatic \
            && sed -i 's/^apply_updates.*/apply_updates = yes/; s/^upgrade_type.*/upgrade_type = security/' /etc/dnf/automatic.conf \
            && systemctl enable --now dnf-automatic.timer) || true
          mkdir -p /opt/seniq
          touch /opt/seniq/.server-ready

  # A fixed public address, so the site's address never changes.
  Address:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref Server

Outputs:
  InstanceId:
    Value: !Ref Server
  PublicIp:
    Value: !Ref Address
  BucketName:
    Value: !Ref Bucket
